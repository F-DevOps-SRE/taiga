services:
  # ------------------------------------------------------------
  # Database
  # ------------------------------------------------------------
  taiga-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - taiga-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [taiga]

  # ------------------------------------------------------------
  # RabbitMQ for real-time events
  # ------------------------------------------------------------
  taiga-events-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - taiga-events-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [taiga]

  # ------------------------------------------------------------
  # RabbitMQ for Celery asynchronous tasks
  # ------------------------------------------------------------
  taiga-async-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - taiga-async-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [taiga]

  # ------------------------------------------------------------
  # Backend API
  # ------------------------------------------------------------
  taiga-back:
    build:
      context: ./src/taiga-back
      dockerfile: Dockerfile
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: settings.config
      DEBUG: ${DEBUG}
      TAIGA_SECRET_KEY: ${TAIGA_SECRET_KEY}
      TAIGA_SITES_SCHEME: ${TAIGA_SITES_SCHEME}
      TAIGA_SITES_DOMAIN: ${TAIGA_SITES_DOMAIN}
      TAIGA_SUBPATH: ${TAIGA_SUBPATH:-}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: taiga-db
      POSTGRES_PORT: 5432
      POSTGRES_SSLMODE: disable
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
      TAIGA_EVENTS_RABBITMQ_HOST: taiga-events-rabbitmq
      TAIGA_ASYNC_RABBITMQ_HOST: taiga-async-rabbitmq
      CELERY_ENABLED: ${CELERY_ENABLED}
      PUBLIC_REGISTER_ENABLED: ${PUBLIC_REGISTER_ENABLED}
      ENABLE_TELEMETRY: ${ENABLE_TELEMETRY}
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: system@taiga.local
      MEDIA_ROOT: /taiga-back/media
      STATIC_ROOT: /taiga-back/static
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT}
    volumes:
      - taiga-static-data:/taiga-back/static
      - taiga-media-data:/taiga-back/media
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-events-rabbitmq:
        condition: service_healthy
      taiga-async-rabbitmq:
        condition: service_healthy
    networks: [taiga]

  # ------------------------------------------------------------
  # Celery worker + beat
  # ------------------------------------------------------------
  taiga-async:
    build:
      context: ./src/taiga-back
      dockerfile: Dockerfile
    environment: *backend-environment
    entrypoint: ["su-exec", "taiga", "celery"]
    command:
      ["-A", "taiga.celery", "worker", "-B", "--concurrency", "2", "-l", "INFO"]
    volumes:
      - taiga-static-data:/taiga-back/static
      - taiga-media-data:/taiga-back/media
    depends_on:
      taiga-db:
        condition: service_healthy
      taiga-async-rabbitmq:
        condition: service_healthy
    networks: [taiga]

  # ------------------------------------------------------------
  # WebSocket events
  # ------------------------------------------------------------
  taiga-events:
    build:
      context: ./src/taiga-events
      dockerfile: Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@taiga-events-rabbitmq:5672/${RABBITMQ_VHOST}
      WEB_SOCKET_SERVER_PORT: 8888
      APP_PORT: 3023
      SECRET: ${TAIGA_SECRET_KEY}
      ALGORITHM: HS256
      USER_ID_CLAIM: user_id
      LOG_LEVEL: info
    depends_on:
      taiga-events-rabbitmq:
        condition: service_healthy
    networks: [taiga]

  # ------------------------------------------------------------
  # Protected media service
  # ------------------------------------------------------------
  taiga-protected:
    build:
      context: ./src/taiga-protected
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${TAIGA_SECRET_KEY}
      MAX_AGE: ${ATTACHMENTS_MAX_AGE}
      TAIGA_SUBPATH: ${TAIGA_SUBPATH:-}
    volumes:
      - taiga-media-data:/app/media:ro
    networks: [taiga]

  # ------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------
  taiga-front:
    build:
      context: ./src/taiga-front
      dockerfile: Dockerfile
    networks: [taiga]

  # ------------------------------------------------------------
  # Single public entry point
  # ------------------------------------------------------------
  taiga-gateway:
    image: nginx:1.30-alpine
    ports:
      - "9000:80"
    volumes:
      - ./taiga-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - taiga-static-data:/taiga/static:ro
      - taiga-media-data:/taiga/media:ro
    depends_on:
      - taiga-front
      - taiga-back
      - taiga-events
      - taiga-protected
    networks: [taiga]

volumes:
  taiga-db-data:
  taiga-events-rabbitmq-data:
  taiga-async-rabbitmq-data:
  taiga-static-data:
  taiga-media-data:

networks:
  taiga:
    name: taiga-network
