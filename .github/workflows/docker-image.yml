name: CI Pipeline - Taiga

on: #Indica cuándo debe arrancar el proceso. Ocurre cada vez que hay un push o pull request a la rama principal
  push: #Subir cambios
    branches: [ "main", "master" ]
  pull_request: #Pedir integrar cambios
    branches: [ "main", "master" ]

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest #Define la máquina virtual donde se va a ejecutar todo el trabajo.
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
    # Descargar el código fuente para usarlo en la máquina virtual creada previamente
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requisito 1: Validación estática de sintaxis y buenas prácticas sobre el Dockerfile y manifiestos (linters)
      - name: Lint all Dockerfiles
        run: |
          find . -name "Dockerfile*" -not -path "*/.*" | xargs -I {} sh -c 'echo "==> Checking {}" && docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < {}'

      # Autenticación con el registro de contenedores de GitHub (GHCR)
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} #Estas son fichas de acceso temporales

      # Requisito 2: Construcción del contenedor de la aplicación
      - name: Build with Docker Compose
        run: |
          docker compose build

      # Requisito 3: Escaneo estático de vulnerabilidades con Trivy sobre cada imagen generada
      - name: Run Trivy vulnerability scanner
        run: |
          for img in $(docker compose config --images); do
            echo "==> Escaneando imagen: $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 0 --severity CRITICAL,HIGH "$img"
          done

       # Requisito 4: Publicación automática de la imagen resultante en un registro de contenedores (GitHub Packages / Docker Hub)
      - name: Push images with Docker Compose
        run: |
          docker compose push
