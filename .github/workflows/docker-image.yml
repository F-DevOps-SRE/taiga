name: CI Pipeline - Taiga

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-validate-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Requisito 1: Linting de todos los Dockerfiles en el proyecto
      - name: Lint all Dockerfiles
        run: |
          find . -name "Dockerfile*" -not -path "*/.*" | xargs -I {} sh -c 'echo "==> Checking {}" && docker run --rm -i hadolint/hadolint hadolint --failure-threshold error - < {}'

      # Autenticación con el registro de GitHub (GHCR)
      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Requisito 2: Construcción de todas las imágenes definidas en docker-compose.yml
      - name: Build with Docker Compose
        run: |
          docker compose build

      # Requisito 4: Publicación de las imágenes en el Registro (si están definidas con el nombre de imagen en docker-compose.yml)
      - name: Push images with Docker Compose
        run: |
          docker compose push
