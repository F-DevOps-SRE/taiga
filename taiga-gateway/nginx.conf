# Access log en JSON (una línea por petición) para todas las rutas: front, API,
# events, media (taiga-protected) y estáticos. Da tráfico, errores y latencia de
# cada servicio visto desde la entrada, incluidos los que no tienen telemetría propia.
# upstream_* son texto: pueden ser "-" o varios valores ("0.003, 0.010").
# Se usa $uri (sin query string): los enlaces de /media/ llevan el token ahí.
log_format taiga_json escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"bytes_sent":$body_bytes_sent,'
    '"upstream_addr":"$upstream_addr",'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"user_agent":"$http_user_agent",'
    '"forwarded_for":"$http_x_forwarded_for"}';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout taiga_json;

    client_max_body_size 50M;
    charset utf-8;

    # Frontend
    location / {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://taiga-front:80;
        proxy_redirect off;
    }

    # API
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://taiga-back:8000/api/;
        proxy_redirect off;
    }

    # Django admin
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://taiga-back:8000/admin/;
        proxy_redirect off;
    }

    # Static files generated by collectstatic.
    location /static/ {
        alias /taiga/static/;
    }

    # Protected media generated by taiga-protected.
    location /media/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://taiga-protected:8003/;
        proxy_redirect off;
    }

    # Internal target used by X-Accel-Redirect from taiga-protected.
    location /_protected/ {
        internal;
        alias /taiga/media/;
        add_header Content-disposition "attachment";
    }

    # Unprotected exported files.
    location /media/exports/ {
        alias /taiga/media/exports/;
        add_header Content-disposition "attachment";
    }

    # WebSocket events.
    location /events {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        proxy_pass http://taiga-events:8888/events;
    }
}
