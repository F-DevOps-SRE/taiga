server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA con html5Mode: las rutas del cliente (p. ej. /project/foo/backlog)
    # no existen como archivos, así que se resuelven a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
